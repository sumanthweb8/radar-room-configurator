name: Deploy Frontend & Backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pipeline
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
        run: npm run build:gh-pages

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/48694572795/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@my-radar-app-496110.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: backend
        run: |
          gcloud run deploy radar-room-backend \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --project my-radar-app-496110 \
            --set-env-vars "CORS_ORIGINS=https://sumanthweb8.github.io"

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()
    steps:
      - name: Send status email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: >-
            [${{ github.repository }}] Deploy ${{
              needs.deploy-frontend.result == 'success' &&
              needs.deploy-backend.result == 'success' &&
              'SUCCESS' || 'FAILURE'
            }}
          to: aravind@kubocare.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.id }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}

            -- Job Results --
            Frontend (GitHub Pages): ${{ needs.deploy-frontend.result }}
            Backend (Cloud Run):     ${{ needs.deploy-backend.result }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
